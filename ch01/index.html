<script>
'use strict';
const CHAPTER = { number: 1, title: 'माझ्या आजूबाजूच्या जगाची सुरुवात', minutes: 8, language: 'mr', next: '../ch02/' };

/* ---------- palette roles ---------- */
const LIVE = COL.leaf, DEAD = COL.stone, SAFF = COL.int, SKY = COL.whole, PLUM = COL.irr, BARK = COL.bark;

/* ---------- text helpers ---------- */
const text = (p, str, x, y, t0, { size = 32, fill = COL.chalk, anchor = 'start', weight = 500, font = UI } = {}) => {
  const e = T(p, str, { x, y, size, fill, anchor, weight, font, o: 0 }); show(e, t0); return e;
};
const title = (p, str, t0 = .1, y = 120) => text(p, str, 800, y, t0, { size: 52, weight: 800, anchor: 'middle', font: HEAD });
const note = (p, str, x, y, t0, fill = SAFF, size = 36, r = -3) => {
  const g = G(p, { x, y, o: 0, r }); T(g, str, { size, fill, font: SCRIPT, weight: 700, anchor: 'middle' }); show(g, t0); return g;
};
function label(p, str, x, y, t0, color = COL.chalk, size = 26) { return text(p, str, x, y, t0, { size, fill: color, anchor: 'middle', weight: 700 }); }
// speech bubble: rounded rect with a tail, text centred
function bubble(p, str, x, y, t0, { w = 420, color = SAFF, size = 30 } = {}) {
  const g = G(p, { x, y, o: 0, s: .7 });
  mk('path', { d: `M${-w / 2} -40h${w}a16 16 0 0 1 16 16v56a16 16 0 0 1-16 16h${-w / 2 + 40}l-24 26v-26h${-w / 2 + 8}a16 16 0 0 1-16-16v-56a16 16 0 0 1 16-16z`, fill: '#fff', stroke: color, 'stroke-width': 3 }, g);
  T(g, str, { y: 12, size, fill: COL.chalk, weight: 600, anchor: 'middle' });
  pop(g, t0); return g;
}
// rounded card
function kcard(p, x, y, w, h, color, { o = 0, s = 1, fill = '#fff' } = {}) {
  const g = G(p, { x, y, o, s });
  mk('rect', { x: 0, y: 0, width: w, height: h, rx: 22, fill, stroke: COL.edge || '#f1e4d0', 'stroke-width': 2 }, g);
  mk('path', { d: `M22 0h-4a18 18 0 0 0-18 18v${h - 36}a18 18 0 0 0 18 18h4z`, fill: color }, g);
  return g;
}

/* ---------- drawn things, each around (0,0) on its baseline ---------- */
function sun(p, x, y, r = 60) {
  const g = G(p, { x, y, o: 0 });
  for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; mk('path', { d: `M${Math.cos(a) * (r + 14)} ${Math.sin(a) * (r + 14)}L${Math.cos(a) * (r + 34)} ${Math.sin(a) * (r + 34)}`, stroke: COL.sun, 'stroke-width': 6, 'stroke-linecap': 'round' }, g); }
  mk('circle', { r, fill: COL.sun }, g);
  return g;
}
function tree(p, x, y, s = 1) {
  const g = G(p, { x, y, s, o: 0 });
  mk('path', { d: 'M-14 0V-90q0-14 14-14q14 0 14 14V0z', fill: BARK }, g);
  mk('circle', { cx: 0, cy: -150, r: 70, fill: COL.leaf2 }, g);
  mk('circle', { cx: -52, cy: -120, r: 48, fill: COL.leaf }, g);
  mk('circle', { cx: 52, cy: -120, r: 48, fill: COL.leaf }, g);
  mk('circle', { cx: 0, cy: -110, r: 50, fill: COL.leaf2 }, g);
  g._crown = g;
  return g;
}
function cow(p, x, y, s = 1) {
  const g = G(p, { x, y, s, o: 0 });
  mk('rect', { x: -70, y: -90, width: 140, height: 70, rx: 30, fill: '#f5efe6', stroke: COL.chalk, 'stroke-width': 3 }, g);
  mk('ellipse', { cx: -20, cy: -70, rx: 18, ry: 14, fill: '#4b4b55' }, g); mk('ellipse', { cx: 30, cy: -45, rx: 16, ry: 12, fill: '#4b4b55' }, g);
  [-50, -20, 20, 50].forEach(lx => mk('rect', { x: lx - 7, y: -24, width: 14, height: 26, rx: 5, fill: '#e6dccd', stroke: COL.chalk, 'stroke-width': 2 }, g));
  mk('rect', { x: 56, y: -112, width: 48, height: 46, rx: 18, fill: '#f5efe6', stroke: COL.chalk, 'stroke-width': 3 }, g);
  mk('path', { d: 'M62 -112q-4-18 10-20M98 -112q4-18-10-20', stroke: COL.chalk, 'stroke-width': 3, fill: 'none', 'stroke-linecap': 'round' }, g);
  mk('circle', { cx: 74, cy: -94, r: 3.5, fill: COL.chalk }, g); mk('circle', { cx: 90, cy: -94, r: 3.5, fill: COL.chalk }, g);
  mk('ellipse', { cx: 82, cy: -76, rx: 14, ry: 8, fill: COL.rose }, g);
  const tail = mk('path', { d: 'M-70 -80q-24 10-18 44', stroke: COL.chalk, 'stroke-width': 3, fill: 'none', 'stroke-linecap': 'round' }, g);
  return g;
}
function dog(p, x, y, s = 1) {
  const g = G(p, { x, y, s, o: 0 });
  mk('rect', { x: -56, y: -64, width: 96, height: 46, rx: 22, fill: '#d9a066', stroke: COL.chalk, 'stroke-width': 3 }, g);
  [-40, -16, 10, 30].forEach(lx => mk('rect', { x: lx - 6, y: -22, width: 12, height: 22, rx: 5, fill: '#c98c52', stroke: COL.chalk, 'stroke-width': 2 }, g));
  const head = G(g, { x: 44, y: -70 });
  mk('circle', { r: 26, fill: '#d9a066', stroke: COL.chalk, 'stroke-width': 3 }, head);
  mk('path', { d: 'M-18 -18q-14-10-10 14M18 -18q14-10 10 14', stroke: COL.chalk, 'stroke-width': 3, fill: '#8a5a2b' }, head);
  mk('circle', { cx: -8, cy: -4, r: 3.5, fill: COL.chalk }, head); mk('circle', { cx: 8, cy: -4, r: 3.5, fill: COL.chalk }, head);
  mk('circle', { cx: 0, cy: 8, r: 5, fill: COL.chalk }, head);
  mk('path', { d: 'M-6 14q6 6 12 0', stroke: COL.chalk, 'stroke-width': 2.5, fill: 'none', 'stroke-linecap': 'round' }, head);
  const tail = path(g, 'M-56 -52q-22-18-16-40', { stroke: COL.chalk, 'stroke-width': 4 }); put(tail, { x: 0, y: 0 });
  g._tail = tail; g._chest = g;
  return g;
}
function sparrow(p, x, y, s = 1, flip = 1) {
  const g = G(p, { x, y, s, o: 0 });
  const b = G(g, { s: 1 }); b.setAttribute('transform', `scale(${flip},1)`);
  mk('ellipse', { rx: 20, ry: 13, fill: '#a3744a', stroke: COL.chalk, 'stroke-width': 2 }, b);
  mk('circle', { cx: 18, cy: -8, r: 9, fill: '#a3744a', stroke: COL.chalk, 'stroke-width': 2 }, b);
  mk('path', { d: 'M26 -8l10 2-10 3z', fill: SAFF }, b);
  mk('circle', { cx: 20, cy: -10, r: 1.8, fill: COL.chalk }, b);
  mk('path', { d: 'M-6 -4q-10-12 4-14q10 2 8 12', fill: '#8a5a2b' }, b);
  mk('path', { d: 'M-20 0l-12-4M-20 2l-12 2', stroke: COL.chalk, 'stroke-width': 2 }, b);
  return g;
}
function bicycle(p, x, y, s = 1) {
  const g = G(p, { x, y, s, o: 0 });
  const w1 = mk('circle', { cx: -48, cy: -30, r: 30, fill: 'none', stroke: DEAD, 'stroke-width': 5 }, g);
  const w2 = mk('circle', { cx: 48, cy: -30, r: 30, fill: 'none', stroke: DEAD, 'stroke-width': 5 }, g);
  mk('path', { d: 'M-48 -30L-14 -78H30L48 -30M-14 -78L0 -30L-48 -30M0 -30L30 -78M30 -78l-6-12h12M-14 -78l-10-8h18', stroke: DEAD, 'stroke-width': 5, fill: 'none', 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, g);
  g._w = [w1, w2];
  return g;
}
function stone(p, x, y, s = 1) {
  const g = G(p, { x, y, s, o: 0 });
  mk('path', { d: 'M-50 0q-10-34 20-44q34-12 56 10q14 20-6 34z', fill: COL.stone2, stroke: DEAD, 'stroke-width': 3 }, g);
  mk('path', { d: 'M-24 -26q10-8 22-4', stroke: '#fff', 'stroke-width': 3, fill: 'none', 'stroke-linecap': 'round', opacity: .7 }, g);
  return g;
}
function wall(p, x, y, s = 1) {
  const g = G(p, { x, y, s, o: 0 });
  mk('rect', { x: -80, y: -100, width: 160, height: 100, rx: 6, fill: '#f3d9b1', stroke: BARK, 'stroke-width': 3 }, g);
  for (let r = 0; r < 4; r++) for (let c = 0; c < 3; c++) mk('rect', { x: -74 + c * 52 + (r % 2) * 26 - 6, y: -96 + r * 25, width: 46, height: 20, rx: 3, fill: '#e8b37d', stroke: BARK, 'stroke-width': 1.5, opacity: .8 }, g);
  return g;
}
function boy(p, x, y, s = 1) {
  const g = G(p, { x, y, s, o: 0 });
  mk('rect', { x: -22, y: -120, width: 44, height: 70, rx: 14, fill: SKY }, g);            // shirt
  mk('rect', { x: -20, y: -52, width: 17, height: 52, rx: 7, fill: '#6b4f3a' }, g); mk('rect', { x: 3, y: -52, width: 17, height: 52, rx: 7, fill: '#6b4f3a' }, g);
  mk('circle', { cx: 0, cy: -146, r: 30, fill: '#f1c7a0' }, g);                             // head
  mk('path', { d: 'M-30 -152q4-30 30-30q26 0 30 30q-18-10-30-6q-12-4-30 6z', fill: '#2b2a33' }, g);  // hair
  mk('circle', { cx: -10, cy: -148, r: 3.5, fill: COL.chalk }, g); mk('circle', { cx: 10, cy: -148, r: 3.5, fill: COL.chalk }, g);
  mk('path', { d: 'M-9 -134q9 8 18 0', stroke: COL.chalk, 'stroke-width': 2.5, fill: 'none', 'stroke-linecap': 'round' }, g);
  mk('path', { d: 'M-22 -108l-18 30M22 -108l18 30', stroke: '#f1c7a0', 'stroke-width': 10, 'stroke-linecap': 'round' }, g);  // arms
  return g;
}
function car(p, x, y, s = 1) {
  const g = G(p, { x, y, s, o: 0 });
  mk('path', { d: 'M-80 -20h160v-30h-40l-24-30h-56l-24 30h-16z', fill: '#f87171', stroke: COL.chalk, 'stroke-width': 3, 'stroke-linejoin': 'round' }, g);
  mk('rect', { x: -40, y: -74, width: 30, height: 22, rx: 4, fill: COL.sky }, g); mk('rect', { x: 0, y: -74, width: 34, height: 22, rx: 4, fill: COL.sky }, g);
  const w1 = mk('circle', { cx: -44, cy: -18, r: 16, fill: '#2b2a33' }, g), w2 = mk('circle', { cx: 44, cy: -18, r: 16, fill: '#2b2a33' }, g);
  g._w = [w1, w2];
  return g;
}
function fan(p, x, y, s = 1) {
  const g = G(p, { x, y, s, o: 0 });
  mk('path', { d: 'M0 0V-40', stroke: DEAD, 'stroke-width': 8, 'stroke-linecap': 'round' }, g);
  mk('rect', { x: -40, y: -8, width: 80, height: 8, rx: 4, fill: DEAD }, g);
  const bl = G(g, { y: -70 });
  [0, 120, 240].forEach(a => mk('ellipse', { cx: 0, cy: -26, rx: 12, ry: 30, fill: '#9fc5f8', stroke: SKY, 'stroke-width': 2, transform: `rotate(${a})` }, bl));
  mk('circle', { r: 10, fill: SKY }, bl);
  g._blades = bl;
  return g;
}
// ground line
const ground = (p, y = 700, t0 = .1) => { const l = path(p, `M80 ${y}H1520`, { stroke: COL.soil, 'stroke-width': 6 }, { d: 0 }); draw(l, t0, 1); return l; };
// a slow wag / spin
const wag = (e, t0, n = 4) => { for (let i = 0; i < n; i++) { tw(e, { r: 18 }, t0 + i * .5, .25, io); tw(e, { r: -10 }, t0 + i * .5 + .25, .25, io); } tw(e, { r: 0 }, t0 + n * .5, .2); };
const spin = (e, t0, dur = 3) => prog(q => put(e, { r: q * 360 * 2 }), t0, dur, lin);

/* ---------- objects for questions ---------- */
const OBJ = { cow: ['गाय', LIVE], dog: ['कुत्रा', LIVE], bird: ['चिमणी', LIVE], tree: ['झाड', LIVE], cycle: ['सायकल', DEAD], wall: ['भिंत', DEAD], stone: ['दगड', DEAD] };
const LD = [['l', 'जिवंत', LIVE], ['d', 'निर्जीव', DEAD]];

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'माझ्या आजूबाजूच्या जगाची सुरुवात', (m, D) => {
    const bg = G(scene, { o: 0 });
    mk('rect', { x: 0, y: 0, width: 1600, height: 900, fill: 'url(#dawnGrad)' }, bg);
    const defs = mk('defs', {}, bg);
    const gr = mk('linearGradient', { id: 'dawnGrad', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
    mk('stop', { offset: 0, 'stop-color': COL.sky }, gr); mk('stop', { offset: .55, 'stop-color': '#ffe6c2' }, gr); mk('stop', { offset: 1, 'stop-color': COL.board }, gr);
    tw(bg, { o: 1 }, 0, 1);
    const s = sun(scene, 800, 760, 90); tw(s, { o: 1, y: 640 }, .2, 2.4, out);
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'नवयान · दिवस १ · धडा १', { x: 800, y: 250, size: 26, fill: SAFF, weight: 700, anchor: 'middle' });
    T(g, 'माझ्या आजूबाजूच्या', { x: 800, y: 350, size: 80, weight: 800, anchor: 'middle', font: HEAD });
    T(g, 'जगाची सुरुवात', { x: 800, y: 450, size: 80, weight: 800, anchor: 'middle', font: HEAD });
    tw(g, { o: 1, y: 0 }, .3, 1.1, out);
    const r = text(scene, 'जिवंत म्हणजे काय?', 800, 560, m('sub'), { size: 40, fill: COL.dim, anchor: 'middle', font: SCRIPT, weight: 700 });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8); hide(s, D - .9, .8); hide(bg, D - .9, .8);
  }],

  ['dawn', 'पहाटेचे पाच वाजले', (m, D) => {
    const p = panel(0);
    const sky = mk('rect', { x: 0, y: 0, width: 1600, height: 900, fill: COL.night, opacity: .9 }, p);
    put(sky, { c_fill: COL.night });
    const hill = mk('path', { d: 'M0 640q400-90 800-40t800 20V900H0z', fill: '#cfe3b0' }, p);
    const s = sun(p, 1470, 720, 70); tw(s, { o: 1 }, .1, .3);
    T(p, 'पहाटेचे पाच वाजले होते.', { x: 800, y: 110, size: 40, fill: '#fff', weight: 700, anchor: 'middle', font: HEAD });
    // sun rises; sky turns from blue to saffron
    tw(s, { y: 600 }, m('sun'), 3.5, io);
    tw(sky, { c_fill: '#3b82f6' }, m('sun'), 1.6, io); tw(sky, { c_fill: '#fdba74' }, m('sun', 1.6), 2.2, io);
    const rooster = text(p, 'कुकूऽऽच कू!', 280, 420, m('sun', 1.2), { size: 30, fill: '#fff', font: SCRIPT, weight: 700, anchor: 'middle' });
    hide(rooster, m('sun', 3.4), .6);
    // two walkers
    const w1 = G(p, { x: -60, y: 640, o: 0 }), w2 = G(p, { x: -200, y: 660, o: 0 });
    [w1, w2].forEach((w, i) => {
      mk('rect', { x: -14, y: -80, width: 28, height: 50, rx: 10, fill: i ? '#f472b6' : '#60a5fa' }, w);
      mk('circle', { cy: -96, r: 16, fill: '#f1c7a0' }, w);
      mk('rect', { x: -12, y: -30, width: 10, height: 30, rx: 4, fill: '#6b4f3a' }, w); mk('rect', { x: 2, y: -30, width: 10, height: 30, rx: 4, fill: '#6b4f3a' }, w);
      mk('rect', { x: 18, y: -54, width: 18, height: 26, rx: 4, fill: i ? COL.stone2 : '#e5e7eb', stroke: COL.chalk, 'stroke-width': 2 }, w);
      show(w, m('walk'), .4); tw(w, { x: 360 + i * 110 }, m('walk'), 5, lin);
    });
    label(p, 'दुधाची कॅन · पाण्याची बादली', 420, 760, m('walk', 1.5), COL.chalk, 24);
    // the house and the mother's call
    const house = G(p, { x: 1180, y: 660, o: 0 });
    mk('rect', { x: -130, y: -140, width: 260, height: 140, rx: 8, fill: '#fde68a', stroke: BARK, 'stroke-width': 3 }, house);
    mk('path', { d: 'M-150 -140L0 -240L150 -140z', fill: '#c2410c' }, house);
    mk('rect', { x: -30, y: -80, width: 60, height: 80, rx: 6, fill: BARK }, house);
    show(house, m('aai'), .4);
    bubble(p, 'अरे, उठ! सूर्य निघतोय!', 1180, 350, m('aai', .6), { w: 460 });
    bubble(p, 'आई… अजून पाच मिनिटं.', 760, 470, m('aai', 2.6), { w: 440, color: SKY, size: 28 });
    bubble(p, 'पाच मिनिटं म्हणजे अर्धा तास!', 1180, 350, m('aai', 4.8), { w: 520 });
    const b = boy(p, 1000, 660); show(b, m('boy'), .5);
    note(p, 'मुलगा हसला', 1000, 760, m('boy', .8), SAFF, 32);
  }],

  ['yard', 'यातलं जिवंत काय आहे?', (m) => {
    const p = panel(0);
    ground(p, 700, .1);
    const b = boy(p, 800, 700, .9); show(b, .2, .5);
    const items = {
      cow: cow(p, 250, 700, .95), dog: dog(p, 520, 700, .95), tree: tree(p, 1300, 700, 1), bird: null,
      cycle: bicycle(p, 1080, 700, .9), wall: wall(p, 1460, 700, .7), stone: stone(p, 640, 700, .8),

    show(items.cycle, m('cycle'), .4); label(p, 'सायकल', 1080, 760, m('cycle', .3), DEAD);
    show(items.wall, m('wall'), .4); label(p, 'भिंत', 1460, 760, m('wall', .3), DEAD);
    show(items.stone, m('stone'), .4); label(p, 'दगड', 640, 760, m('stone', .3), DEAD);

    mk('rect', { x: -360, y: -52, width: 720, height: 90, rx: 45, fill: '#fff', stroke: SAFF, 'stroke-width': 3 }, q);

  ['look', 'थांबा… आणि पाहा!', (m) => {

    const w = note(p, 'फक्त उत्तर देऊ नका… का? याचा विचार करा.', 800, 760, m('why'), SAFF, 40);
  }],

  ['q1', 'छोटी तपासणी', () => { panel(0); }, { ask: done => quiz(SCREEN, [{

    text(p, 'घोकायची नाहीत. मोठ्याने बोलायची.', 800, 190, .5, { size: 30, fill: COL.dim, anchor: 'middle' });
    const row = (en, mr, y, mark, drawer) => {
      const g = kcard(p, 200, y, 1200, 150, PLUM, { o: 0 }); tw(g, { o: 1 }, m(mark), .5);
      T(g, en, { x: 60, y: 66, size: 44, fill: PLUM, weight: 800, font: HEAD });
      T(g, mr, { x: 60, y: 116, size: 28, fill: COL.chalk, weight: 600 });
      const d = drawer(g); if (d) { show(d, m(mark, .3), .4); }
    };
    row('This is a plant.', 'ही एक वनस्पती आहे.', 250, 'e1', g => tree(g, 1080, 135, .55));
    row('This is a dog.', 'हा एक कुत्रा आहे.', 430, 'e2', g => dog(g, 1060, 135, .9));
    row('I am a living being.', 'मी एक सजीव आहे.', 610, 'e3', g => boy(g, 1080, 140, .6));
    note(p, 'स्वतःकडे पाहा, आणि मोठ्याने बोला!', 800, 830, m('e3', 1.2), SAFF, 34);
  }],

  ['wrap', 'आज आपण काय शिकलो?', (m) => {
    const p = panel(0);
    title(p, 'आज आपण काय शिकलो?', .1);
    [['जिवंत गोष्टी वाढतात, अन्न खातात, श्वास घेतात.', 'w1', LIVE],
     ['हालचाल म्हणजेच जीवन नाही.', 'w2', COL.bad],
     ['विज्ञान = पाहणं · प्रश्न · निरीक्षण · उत्तर', 'w3', SKY],
     ['जीवन शांत असू शकतं, पण थांबलेलं नसतं.', 'w4', SAFF]].forEach(([str, mark, color], i) => {
      const g = G(p, { x: -16, y: 250 + i * 120, o: 0 });
      mk('circle', { cx: 280, cy: -12, r: 28, fill: color }, g);
      T(g, String(i + 1), { x: 280, y: -1, size: 28, fill: '#fff', weight: 800, anchor: 'middle' });
      T(g, str, { x: 334, size: 34, weight: 700 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'धड्याचा सराव', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-ld2', prompt: ['प्रत्येक गोष्ट जिवंत आहे की निर्जीव?'],
    build: grid([
      { parts: ['पंखा'], ans: ['d'], why: 'फिरतो, पण वाढत नाही, खात नाही, श्वास घेत नाही.' },
      { parts: ['फुलपाखरू'], ans: ['l'], why: 'उडतं, खातं, अंड्यातून जन्माला येतं.' },
      { parts: ['गवत'], ans: ['l'], why: 'गवत वाढतं. वनस्पती जिवंत असतात.' },
      { parts: ['नदीचं पाणी'], ans: ['d'], why: 'वाहतं, पण वाढत नाही, खात नाही. हालचाल म्हणजेच जीवन नाही.' },
      { parts: ['बीज (बी)'], ans: ['l'], why: 'बीजातून रोप येतं. ते जिवंत आहे, फक्त शांत आहे.' },
      { parts: ['मोबाईल'], ans: ['d'], why: 'बोलतो, वाजतो, पण जिवंत नाही.' },
    ], LD, { multi: false, text: true }),
  }], done, 'धड्याचा सराव   १ पैकी २') }],

  ['final2', 'धड्याचा सराव', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-stone', prompt: ['दगड निर्जीव का आहे?'],
    build: choice([
      ['तो वाढत नाही, अन्न खात नाही, श्वास घेत नाही.'],
      ['तो हालचाल करत नाही.'],
      ['तो राखाडी रंगाचा आहे.'],
      ['तो जड आहे.'],
    ], 0, 'बरोबर! जीवनाची लक्षणं: वाढ, अन्न, श्वास. दगडात यातलं काहीच नाही.', [
      null,
      'हालचाल हे लक्षण नाही. झाडही हलत नाही, तरी जिवंत आहे; गाडी हलते, तरी निर्जीव आहे.',
      'रंगाचा जिवंतपणाशी संबंध नाही. हिरवं पान आणि राखाडी हत्ती, दोन्ही जिवंत.',
      'वजनाचा संबंध नाही. हत्ती जड आहे आणि जिवंत आहे.',
    ]),
  }], done, 'धड्याचा सराव   २ पैकी २') }],

  ['finish', 'पूर्ण', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
