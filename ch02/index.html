<script>
'use strict';
const CHAPTER = { number: 2, title: 'Hello, English!', minutes: 6, language: 'mr', next: '../ch03/' };

/* ---------- palette roles ---------- */
const PLUM = COL.irr, SKY = COL.whole, LIVE = COL.leaf, SAFF = COL.int, CORAL = '#e0524d', DEAD = COL.stone, BARK = COL.bark;
// one colour per sentence pattern, kept through the chapter
const PAT = { am: PLUM, name: SKY, live: LIVE, like: SAFF, want: CORAL };

/* ---------- text helpers (as in ch01) ---------- */
const text = (p, str, x, y, t0, { size = 32, fill = COL.chalk, anchor = 'start', weight = 500, font = UI } = {}) => {
  const e = T(p, str, { x, y, size, fill, anchor, weight, font, o: 0 }); show(e, t0); return e;
};
const title = (p, str, t0 = .1, y = 120, fill = PLUM) => text(p, str, 800, y, t0, { size: 56, weight: 800, anchor: 'middle', font: HEAD, fill });
const note = (p, str, x, y, t0, fill = SAFF, size = 36, r = -3) => {
  const g = G(p, { x, y, o: 0, r }); T(g, str, { size, fill, font: SCRIPT, weight: 700, anchor: 'middle' }); show(g, t0); return g;
};
function label(p, str, x, y, t0, color = COL.chalk, size = 26) { return text(p, str, x, y, t0, { size, fill: color, anchor: 'middle', weight: 700 }); }
function bubble(p, str, x, y, t0, { w = 420, color = SAFF, size = 30, font = UI } = {}) {
  const g = G(p, { x, y, o: 0, s: .7 });
  mk('path', { d: `M${-w / 2} -40h${w}a16 16 0 0 1 16 16v56a16 16 0 0 1-16 16h${-w / 2 + 40}l-24 26v-26h${-w / 2 + 8}a16 16 0 0 1-16-16v-56a16 16 0 0 1 16-16z`, fill: '#fff', stroke: color, 'stroke-width': 3 }, g);
  T(g, str, { y: 12, size, fill: COL.chalk, weight: 600, anchor: 'middle', font });
  pop(g, t0); return g;
}
function kcard(p, x, y, w, h, color, { o = 0, s = 1, fill = '#fff' } = {}) {
  const g = G(p, { x, y, o, s });
  mk('rect', { x: 0, y: 0, width: w, height: h, rx: 22, fill, stroke: COL.edge || '#f1e4d0', 'stroke-width': 2 }, g);
  mk('path', { d: `M22 0h-4a18 18 0 0 0-18 18v${h - 36}a18 18 0 0 0 18 18h4z`, fill: color }, g);
  return g;
}

/* ---------- drawn things (around (0,0) on the baseline); en- prefix avoids engine names ---------- */
function tree(p, x, y, s = 1) {
  const g = G(p, { x, y, s, o: 0 });
  mk('path', { d: 'M-14 0V-90q0-14 14-14q14 0 14 14V0z', fill: BARK }, g);
  mk('circle', { cx: 0, cy: -150, r: 70, fill: COL.leaf2 }, g);
  mk('circle', { cx: -52, cy: -120, r: 48, fill: COL.leaf }, g);
  mk('circle', { cx: 52, cy: -120, r: 48, fill: COL.leaf }, g);
  mk('circle', { cx: 0, cy: -110, r: 50, fill: COL.leaf2 }, g);
  return g;
}
// a child: boy or girl, shirt colour, optional waving arm
function enKid(p, x, y, s = 1, { shirt = SKY, girl = false, wave = false } = {}) {
  const g = G(p, { x, y, s, o: 0 });
  if (girl) {
    mk('path', { d: 'M-22 -120h44l16 74h-76z', fill: shirt }, g);
    mk('rect', { x: -18, y: -48, width: 14, height: 48, rx: 6, fill: '#f1c7a0' }, g); mk('rect', { x: 4, y: -48, width: 14, height: 48, rx: 6, fill: '#f1c7a0' }, g);
    mk('rect', { x: -20, y: -8, width: 18, height: 8, rx: 3, fill: '#6b4f3a' }, g); mk('rect', { x: 2, y: -8, width: 18, height: 8, rx: 3, fill: '#6b4f3a' }, g);
  } else {
    mk('rect', { x: -22, y: -120, width: 44, height: 70, rx: 14, fill: shirt }, g);
    mk('rect', { x: -20, y: -52, width: 17, height: 52, rx: 7, fill: '#6b4f3a' }, g); mk('rect', { x: 3, y: -52, width: 17, height: 52, rx: 7, fill: '#6b4f3a' }, g);
  }
  mk('circle', { cx: 0, cy: -146, r: 30, fill: '#f1c7a0' }, g);
  if (girl) {
    mk('path', { d: 'M-30 -150q0-32 30-32q30 0 30 32l8 48h-16l-8-44q-14 8-28 8q-14 0-28-8l-8 44h-16z', fill: '#2b2a33' }, g);
    mk('circle', { cx: 24, cy: -168, r: 7, fill: CORAL }, g);
  } else {
    mk('path', { d: 'M-30 -152q4-30 30-30q26 0 30 30q-18-10-30-6q-12-4-30 6z', fill: '#2b2a33' }, g);
  }
  mk('circle', { cx: -10, cy: -148, r: 3.5, fill: COL.chalk }, g); mk('circle', { cx: 10, cy: -148, r: 3.5, fill: COL.chalk }, g);
  mk('path', { d: 'M-9 -134q9 8 18 0', stroke: COL.chalk, 'stroke-width': 2.5, fill: 'none', 'stroke-linecap': 'round' }, g);
  mk('path', { d: wave ? 'M-22 -108l-18 30M22 -108l36 -28' : 'M-22 -108l-18 30M22 -108l18 30', stroke: '#f1c7a0', 'stroke-width': 10, 'stroke-linecap': 'round' }, g);
  return g;
}
// a sentence brick: rounded box with a word or phrase, centred on (x,y)
function enBrick(p, str, x, y, color, { size = 36, w, h = 70, fill = '#fff', dash = false, s = .8 } = {}) {
  const ww = w || Math.max(90, Math.round(str.length * size * .56) + 44);
  const g = G(p, { x, y, o: 0, s });
  const a = { x: -ww / 2, y: -h / 2, width: ww, height: h, rx: 16, fill, stroke: color, 'stroke-width': 3 };
  if (dash) a['stroke-dasharray'] = '12 9';
  mk('rect', a, g);
  T(g, str, { y: size * .36, size, fill: color, weight: 800, anchor: 'middle', font: HEAD });
  g._w = ww; return g;
}
// a row of bricks from a left edge; items [{t, color, dash, w}]; pops them in order. returns bricks (with ._cx)
function enBricks(p, items, x0, y, t0, { size = 36, gap = 14, step = .35, at } = {}) {
  let x = x0;
  return items.map((it, i) => {
    const ww = it.w || Math.max(90, Math.round(it.t.length * size * .56) + 44);
    const b = enBrick(p, it.t, x + ww / 2, y, it.color, { size, w: ww, dash: it.dash, fill: it.fill || '#fff' });
    b._cx = x + ww / 2; x += ww + gap;
    pop(b, t0 + i * step);
    if (at != null) pulse(b, at + i * .25, 1.1);   // the words are named: each brick nods in turn
    return b;
  });
}
// an English sentence with its Marathi meaning under it
function enPair(p, en, mr, x, y, t0, { color = PLUM, size = 40, anchor = 'start', mrSize } = {}) {
  const g = G(p, { x: x - 18, y, o: 0 });
  T(g, en, { size, fill: color, weight: 800, font: HEAD, anchor });
  if (mr) T(g, mr, { y: size * .95, size: mrSize || Math.round(size * .65), fill: COL.dim, weight: 600, anchor });
  tw(g, { o: 1, x }, t0, .5, out); return g;
}
// pattern formula bar: "I + am + information"
function enFormula(p, parts, color, x, y, t0, { w = 760 } = {}) {
  const g = G(p, { x, y, o: 0, s: .85 });
  mk('rect', { x: -w / 2, y: -46, width: w, height: 92, rx: 46, fill: '#fff', stroke: color, 'stroke-width': 3 }, g);
  T(g, parts.join('  +  '), { y: 14, size: 38, fill: color, weight: 800, anchor: 'middle', font: HEAD });
  pop(g, t0); return g;
}
// a hut, a row of city buildings, an ID card, a microphone, a signpost
function enHouse(p, x, y, s = 1) {
  const g = G(p, { x, y, s, o: 0 });
  mk('rect', { x: -110, y: -120, width: 220, height: 120, rx: 8, fill: '#fde68a', stroke: BARK, 'stroke-width': 3 }, g);
  mk('path', { d: 'M-130 -120L0 -210L130 -120z', fill: '#c2410c' }, g);
  mk('rect', { x: -26, y: -70, width: 52, height: 70, rx: 6, fill: BARK }, g);
  mk('rect', { x: 40, y: -96, width: 44, height: 40, rx: 4, fill: COL.sky, stroke: BARK, 'stroke-width': 2 }, g);
  return g;
}
function enCity(p, x, y, s = 1) {
  const g = G(p, { x, y, s, o: 0 });
  [[-150, 160, '#cbd5e1'], [-60, 230, '#94a3b8'], [50, 190, '#cbd5e1'], [130, 120, '#94a3b8']].forEach(([bx, bh, f]) => {
    mk('rect', { x: bx, y: -bh, width: 80, height: bh, rx: 4, fill: f, stroke: '#475569', 'stroke-width': 2 }, g);
    for (let r = 0; r < Math.floor(bh / 40); r++) for (let c = 0; c < 2; c++) mk('rect', { x: bx + 14 + c * 32, y: -bh + 14 + r * 40, width: 20, height: 18, rx: 2, fill: '#fef3c7' }, g);
  });
  return g;
}
function enIdCard(p, x, y, s = 1, color = SKY) {
  const g = G(p, { x, y, s, o: 0 });
  mk('rect', { x: -130, y: -84, width: 260, height: 168, rx: 16, fill: '#fff', stroke: color, 'stroke-width': 4 }, g);
  mk('rect', { x: -130, y: -84, width: 260, height: 34, rx: 16, fill: color }, g); mk('rect', { x: -130, y: -60, width: 260, height: 10, fill: color }, g);
  mk('rect', { x: -108, y: -32, width: 80, height: 92, rx: 10, fill: COL.sky }, g);
  mk('circle', { cx: -68, cy: -4, r: 16, fill: '#f1c7a0' }, g); mk('path', { d: 'M-98 52q0-34 30-34q30 0 30 34z', fill: color }, g);
  [[-10, 170], [20, 120], [50, 140]].forEach(([ly, lw]) => mk('rect', { x: -14, y: ly - 6, width: lw * .7, height: 12, rx: 6, fill: '#e2e8f0' }, g));
  return g;
}
function enMic(p, x, y, s = 1) {
  const g = G(p, { x, y, s, o: 0 });
  // stand, handle, capsule head with a grille, and sound waves
  mk('path', { d: 'M-50 0h100', stroke: DEAD, 'stroke-width': 8, 'stroke-linecap': 'round' }, g);
  mk('rect', { x: -9, y: -70, width: 18, height: 70, rx: 6, fill: DEAD }, g);
  mk('path', { d: 'M-44 -130v30a44 44 0 0 0 88 0v-30', stroke: '#6b7280', 'stroke-width': 7, fill: 'none', 'stroke-linecap': 'round' }, g);
  mk('rect', { x: -30, y: -210, width: 60, height: 110, rx: 30, fill: PLUM }, g);
  for (let i = 0; i < 4; i++) mk('path', { d: `M-22 ${-190 + i * 22}h44`, stroke: '#fff', 'stroke-width': 3, opacity: .55 }, g);
  mk('path', { d: 'M50 -190q24 34 0 68M-50 -190q-24 34 0 68', stroke: PLUM, 'stroke-width': 4, fill: 'none', 'stroke-linecap': 'round', opacity: .6 }, g);
  mk('path', { d: 'M74 -206q40 50 0 100M-74 -206q-40 50 0 100', stroke: PLUM, 'stroke-width': 4, fill: 'none', 'stroke-linecap': 'round', opacity: .3 }, g);
  return g;
}
function enSign(p, str, x, y, color, t0) {
  const g = G(p, { x, y, o: 0, s: .8 });
  mk('rect', { x: -4, y: -120, width: 8, height: 120, fill: BARK }, g);
  mk('path', { d: 'M-90 -128h170l20 22l-20 22h-170z', fill: '#fff', stroke: color, 'stroke-width': 3 }, g);
  T(g, str, { x: -2, y: -96, size: 26, fill: color, weight: 800, anchor: 'middle', font: HEAD });
  pop(g, t0); return g;
}
// chat bubble for the conversation: side 'l' (left speaker) or 'r'
function enChat(p, str, y, side, color, t0, { size = 28 } = {}) {
  const w = Math.round(str.length * size * .5) + 44, x = side === 'l' ? 420 : 1180 - w;
  const g = G(p, { x, y, o: 0 });
  mk('rect', { x: 0, y: -34, width: w, height: 52, rx: 18, fill: side === 'l' ? '#fff' : color, stroke: color, 'stroke-width': 2.5 }, g);
  mk('path', { d: side === 'l' ? 'M4 -2l-16 14l20-2z' : `M${w - 4} -2l16 14l-20-2z`, fill: side === 'l' ? '#fff' : color, stroke: color, 'stroke-width': 2.5 }, g);
  T(g, str, { x: 22, y: 4, size, fill: side === 'l' ? COL.chalk : '#fff', weight: 600 });
  put(g, { x: x + (side === 'l' ? -20 : 20) }); tw(g, { o: 1, x }, t0, .4, out);
  return g;
}
const ground = (p, y = 700, t0 = .1) => { const l = path(p, `M80 ${y}H1520`, { stroke: COL.soil, 'stroke-width': 6 }, { d: 0 }); draw(l, t0, 1); return l; };
// a plum underline blank
const enBlank = (p, x, y, w, color = PLUM) => mk('path', { d: `M${x} ${y}h${w}`, stroke: color, 'stroke-width': 4, 'stroke-linecap': 'round', 'stroke-dasharray': '10 8' }, p);

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Hello, English!', (m, D) => {
    const p = panel(0);
    const bg = mk('rect', { x: 0, y: 0, width: 1600, height: 900, fill: '#f5effe' }, p); put(bg, { o: 0 }); tw(bg, { o: 1 }, 0, 1);
    const g = G(p, { o: 0, y: 24 });
    T(g, 'नवयान · दिवस १ · धडा २ · English', { x: 800, y: 250, size: 26, fill: SAFF, weight: 700, anchor: 'middle' });
    T(g, 'Hello, English!', { x: 800, y: 420, size: 128, fill: PLUM, weight: 800, anchor: 'middle', font: HEAD });
    tw(g, { o: 1, y: 0 }, .3, 1.1, out);
    [['Hello!', 240, 300, SKY, 220], ['Hi!', 1360, 280, SAFF, 160], ['Good morning!', 1300, 640, LIVE, 360], ['My name is…', 290, 660, CORAL, 320]]
      .forEach(([s, x, y, c, w], i) => bubble(p, s, x, y, m('hello', i * .3), { w, color: c, size: 32, font: HEAD }));
    text(p, 'आज आपण स्वतःची ओळख English मध्ये करून देऊ.', 800, 560, m('sub'), { size: 40, fill: COL.dim, anchor: 'middle', font: SCRIPT, weight: 700 });
  }],

  ['known', 'Let us begin with simple English', (m) => {
    const p = panel(0);
    title(p, 'Let us begin with simple English', .1);
    text(p, 'आपण आधीच अनेक English words वापरतो.', 800, 190, .5, { size: 30, fill: COL.dim, anchor: 'middle' });
    const words = ['School', 'book', 'pen', 'bus', 'mobile', 'teacher', 'Market', 'hospital', 'doctor'];
    const pos = [[330, 320], [620, 290], [900, 330], [1200, 300], [430, 470], [760, 480], [1080, 460], [1340, 470], [600, 630]];
    const chips = words.map((w, i) => { const b = enBrick(p, w, pos[i][0], pos[i][1], PLUM, { size: 38, h: 76 }); pop(b, m('w' + (i + 1))); return b; });
    const nn = note(p, 'English आपल्यासाठी नवीन नाही!', 1100, 650, m('new', .3), SAFF, 40); hide(nn, m('build'), .4);
    // words gather into a pile, an arrow, and a sentence appears
    chips.forEach((b, i) => tw(b, { x: 300 + (i % 3) * 26 - 26, y: 540 + Math.floor(i / 3) * 44 - 70, s: .8 }, m('build'), .9, io));
    const wl = label(p, 'words', 300, 650, m('build', .9), PLUM, 30);
    const ar = path(p, 'M470 500H700', { stroke: COL.dim, 'stroke-width': 5 }, { d: 0 }); draw(ar, m('build', 1), .6);
    const ah = mk('path', { d: 'M690 486l20 14-20 14', stroke: COL.dim, 'stroke-width': 5, fill: 'none' }, p); put(ah, { o: 0 }); show(ah, m('build', 1.5), .2);
    const card = kcard(p, 740, 420, 700, 170, PLUM); tw(card, { o: 1 }, m('build', 1.7), .5);
    T(card, 'I am a student.', { x: 60, y: 76, size: 46, fill: PLUM, weight: 800, font: HEAD });
    T(card, 'मी विद्यार्थी आहे.', { x: 60, y: 128, size: 28, fill: COL.dim, weight: 600 });
    label(p, 'sentences', 1090, 640, m('build', 2), PLUM, 30);
    note(p, 'चला, सुरुवात करूया!', 800, 790, m('go'), PLUM, 44);
  }],

  ['iam', 'I am…', (m) => {
    const p = panel(0);
    title(p, 'I am…', .1, 110, PAT.am);
    text(p, 'सगळ्यात उपयोगी sentence patterns पैकी एक', 800, 170, .4, { size: 28, fill: COL.dim, anchor: 'middle' });
    const bricks = enBricks(p, [{ t: 'I', color: PAT.am }, { t: 'am', color: PAT.am }, { t: '________', color: PAT.am, dash: true, w: 300 }], 120, 280, .6, { size: 40, at: m('pat') });
    const slot = bricks[2]._cx;
    const ex = [['a student', 'मी विद्यार्थी आहे.'], ['a boy', 'मी मुलगा आहे.'], ['a girl', 'मी मुलगी आहे.'], ['happy', 'मी आनंदी आहे.']];
    let prev = null;
    ex.forEach(([en, mr], i) => {
      const t0 = m('s' + (i + 1));
      const b = enBrick(p, en, slot, 280, PAT.am, { size: 40, w: 300, fill: '#f5effe' });
      if (prev) hide(prev, t0, .3);
      pop(b, t0 + .1); prev = b;
      enPair(p, 'I am ' + en + '.', mr, 140 + (i % 2) * 460, 420 + Math.floor(i / 2) * 150, t0 + .4, { color: PAT.am, size: 40 });
    });
    const boyK = enKid(p, 1300, 700, 1.4); show(boyK, .8, .5);
    const book = G(p, { x: 1240, y: 600, o: 0 }); mk('rect', { x: -22, y: -16, width: 44, height: 32, rx: 4, fill: SAFF, stroke: BARK, 'stroke-width': 2 }, book); mk('path', { d: 'M0 -16v32', stroke: BARK, 'stroke-width': 2 }, book); show(book, m('s1', .3), .3); hide(book, m('s2'), .3);
    const girlK = enKid(p, 1300, 700, 1.4, { shirt: CORAL, girl: true }); hide(boyK, m('s3'), .3); show(girlK, m('s3'), .4);
    for (let i = 0; i < 5; i++) { const sp = T(p, '✦', { x: 1180 + i * 60, y: 420 + (i % 2) * 40, size: 34, fill: SAFF, anchor: 'middle', o: 0 }); put(sp, { s: 0 }); pop(sp, m('s4', .2 + i * .12)); }
    const smile = text(p, 'happy!', 1300, 400, m('s4', .5), { size: 34, fill: SAFF, font: SCRIPT, weight: 700, anchor: 'middle' });
    const gl = path(p, 'M1120 700H1500', { stroke: COL.soil, 'stroke-width': 6 }, { d: 0 }); draw(gl, .2, .8);
    enFormula(p, ['I', 'am', 'information'], PAT.am, 560, 790, m('rule', .4), { w: 820 });
    note(p, 'स्वतःबद्दल अनेक sentences!', 1300, 850, m('rule', 2.4), SAFF, 32);
  }],

  ['name', 'My name is…', (m) => {
    const p = panel(0);
    title(p, 'My name is…', .1, 110, PAT.name);
    text(p, 'introduction मधील एक महत्त्वाचे sentence', 800, 170, .4, { size: 28, fill: COL.dim, anchor: 'middle' });
    const idc = enIdCard(p, 300, 330, 1, PAT.name); pop(idc, .5);
    enBricks(p, [{ t: 'My name is', color: PAT.name }, { t: '________', color: PAT.name, dash: true, w: 260 }], 500, 280, .6, { size: 40, at: m('pat') });
    const kid = enKid(p, 300, 720, 1.2); show(kid, m('amol'), .4);
    label(p, 'Amol', 300, 770, m('amol', .2), PAT.name, 30);
    bubble(p, 'My name is Amol.', 560, 520, m('amol', .4), { w: 400, color: PAT.name, size: 34, font: HEAD });
    text(p, 'माझे नाव अमोल आहे.', 560, 600, m('amol', 1.4), { size: 28, fill: COL.dim, anchor: 'middle' });
    const you = enBrick(p, 'तुमचे नाव', 912, 280, SAFF, { size: 32, w: 260, fill: '#fff7e6' }); pop(you, m('you', .6));
    pulse(you, m('you', 1.4), 1.12); pulse(you, m('you', 2.2), 1.12);
    // the introduction card on the right
    const card = kcard(p, 900, 380, 640, 330, PAT.name); tw(card, { o: 1 }, m('two', -.2), .5);
    const lines = [['My name is Amol.', PAT.name, m('two', -.1)], ['I am a student.', PAT.am, m('two')], ['I study in Class ____.', PLUM, m('three')]];
    lines.forEach(([s, c, t0], i) => enPair(card, (i + 1) + '.  ' + s, null, 50, 80 + i * 72, t0, { color: c, size: 38 }));
    const tag = T(card, 'ही एक छोटी introduction!', { x: 320, y: 296, size: 30, fill: SAFF, weight: 700, anchor: 'middle', font: SCRIPT, o: 0 }); show(tag, m('intro', 11.1));

  }],

  ['q1', 'छोटी तपासणी', () => { panel(0); }, { ask: done => quiz({ x: 300, y: 180, w: 1000, cls: 'side', maxH: 540 }, [{
    id: 'c-girl', prompt: ['“मी मुलगी आहे.” हे English मध्ये कसे म्हणाल?'],
    build: choice([
      ['I am a girl.'],
      ['My name is girl.'],
      ['I am girl am.'],
    ], 0, 'बरोबर! I + am + information. मी = I, आहे = am, मुलगी = a girl.', [
      null,
      '“My name is” नंतर नाव येतं. girl हे नाव नाही. “मी … आहे” म्हणजे I am …',
      'am फक्त एकदाच येतं. Pattern: I + am + information.',
    ]),
  }], done, 'छोटी तपासणी') }],

  ['live', 'I live in…', (m) => {
    const p = panel(0);
    title(p, 'I live in…', .1, 110, PAT.live);

    const gl = path(p, 'M80 800H260', { stroke: COL.soil, 'stroke-width': 6 }, { d: 0 }); draw(gl, .3, .5);
    let prevB = null, prevM = null;
    steps.forEach(([act, mr], i) => {
      const x = 260 + i * 250, top = 800 - i * 95, t0 = m('w' + (i + 1));
      const st_ = mk('rect', { x, y: top, width: 250, height: 880 - top, rx: 6, fill: i % 2 ? '#fde8e7' : '#fff1f0', stroke: PAT.want, 'stroke-width': 2 }, p); put(st_, { o: 0 }); show(st_, t0, .3);

  }],
