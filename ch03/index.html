      const ty = T(c, '→ ' + yes, { x: 170, y: 340, size: 24, fill: color, weight: 800, anchor: 'middle', o: 0 }); show(ty, t0 + 2.6);
    });
    dwBanner(p, 'Learning starts when you start looking, asking and thinking.', 800, 650, m('quote'), { w: 1360, size: 34 });
    // zoom into the tree: the cell
    const tr = tree(p, 520, 880, .6); show(tr, m('cell'), .4);
    const lens = G(p, { x: 520, y: 790, o: 0, s: .5 }); mk('circle', { r: 60, fill: 'none', stroke: INK, 'stroke-width': 6 }, lens); mk('path', { d: 'M42 42l40 40', stroke: INK, 'stroke-width': 8, 'stroke-linecap': 'round' }, lens);
    pop(lens, m('cell', 3.8)); tw(lens, { x: 1000, y: 800, s: 1 }, m('cell', 6.4), 1, io);
    const cell = G(p, { x: 1000, y: 800, o: 0, s: .4 });
    mk('ellipse', { rx: 54, ry: 44, fill: '#e9f8ee', stroke: LIVE, 'stroke-width': 4 }, cell); mk('circle', { cx: 10, cy: -4, r: 14, fill: LIVE }, cell);
    for (let i = 0; i < 6; i++) mk('circle', { cx: Math.cos(i) * 36, cy: Math.sin(i * 1.3) * 26, r: 4, fill: SAFF }, cell);
    tw(cell, { o: 1, s: 1 }, m('cell', 7.4), .6, back);
    note(p, 'इतकं आत, की डोळ्यांना दिसणारही नाही', 250, 830, m('cell', 9.2), COL.dim, 24, -3);
    text(p, 'The Cell · पेशी', 1090, 812, m('cell', 13.8), { size: 34, fill: LIVE, weight: 800, font: HEAD });
  }],

  ['wrap', 'आज आपण काय शिकलो?', (m) => {
    const p = panel(0);
    title(p, 'आज आपण काय शिकलो?', .1, 100, CORAL);
    [['Digital = माहिती इलेक्ट्रॉनिक पद्धतीने तयार करणे · साठवणे · पाठवणे · वापरणे.', 'w1', CORAL],
     ['Technology = गरजांसाठी माणसाने बनवलेली साधनं. गरज तीच, साधनं बदलतात.', 'w2', SKY],
     ['चांगली की वाईट? आपण ती कशी वापरतो, यावर ठरतं.', 'w3', LIVE],
     ['Digital Responsibility: password, photo, चुकीची माहिती — जबाबदारीने.', 'w4', SAFF]].forEach(([str, mark, color], i) => {
      const g = G(p, { x: -16, y: 230 + i * 120, o: 0 });
      mk('circle', { cx: 160, cy: -12, r: 28, fill: color }, g);
      T(g, String(i + 1), { x: 160, y: -1, size: 28, fill: '#fff', weight: 800, anchor: 'middle' });
      T(g, str, { x: 214, size: 30, weight: 700 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
    note(p, 'आता धड्याचा सराव करूया.', 800, 780, m('end'), SAFF, 34, 0);
  }],

  ['final1', 'धड्याचा सराव', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-resp', prompt: ['प्रत्येक कृती जबाबदारीची आहे की नाही?'],
    build: grid([
      { parts: ['मित्राचा password घेऊन त्याच्या account मध्ये जाणे'], ans: ['no'], why: 'दुसऱ्याचा password चोरू नये. ही Digital Responsibility नाही.' },
      { parts: ['photo share करण्याआधी मैत्रिणीला विचारणे'], ans: ['ok'], why: 'परवानगी घेणे ही जबाबदारी. personal photo परवानगीशिवाय share करू नये.' },
      { parts: ['forward आलेली बातमी न तपासता पुढे पाठवणे'], ans: ['no'], why: 'न तपासता पाठवली तर चुकीची माहिती पसरते.' },
      { parts: ['project साठी search engine वर माहिती शोधणे'], ans: ['ok'], why: 'Technology can help us — Learn. हा चांगला वापर.' },
      { parts: ['एक video म्हणून उघडून पाच तास random videos पाहणे'], ans: ['no'], why: 'तोच mobile, पण वेळ वाया. How do we use it?' },
      { parts: ['आईला message: "I will come home at 5."'], ans: ['ok'], why: 'आरवसारखं — एका गरजेसाठी technology चा वापर.' },
    ], RESP, { multi: false, text: true }),
  }], done, 'धड्याचा सराव   १ पैकी २') }],

  ['final2', 'धड्याचा सराव', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-tech', prompt: ['Technology म्हणजे काय?'],
    build: choice([
      ['फक्त computer आणि mobile.'],
      ['माणसाने आपल्या गरजा पूर्ण करण्यासाठी तयार केलेली साधनं, पद्धती आणि प्रणाली.'],
      ['जी वस्तू विजेवर चालते ती.'],
      ['फक्त internet.'],
    ], 1, 'बरोबर! पत्र, telephone, video call — गरज तीच, साधनं बदलली. हीच technology.', [
      'Mixer, traffic signal, पत्रही technology आहे. फक्त computer आणि mobile नाही.',
      null,
      'पत्र विजेवर चालत नाही, तरी ती बातमी पाठवण्याची technology होती.',
      'Internet हे एक साधन आहे. Technology त्यापेक्षा खूप मोठी आहे.',
    ]),
  }], done, 'धड्याचा सराव   २ पैकी २') }],

  ['finish', 'पूर्ण', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

// used only inside the final1 ask closure
const RESP = [['ok', 'जबाबदारीची', LIVE], ['no', 'नाही', DEAD]];

boot();
</script>
