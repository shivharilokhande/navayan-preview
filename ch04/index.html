function hop(e, x2, t0, dur = .5, hgt = 60, y2 = null) {
  let x1 = null, y1 = null;
  prog(q => { if (x1 === null) { x1 = st(e).x; y1 = st(e).y; } const yy = y2 === null ? y1 : y1 + (y2 - y1) * q; put(e, { x: x1 + (x2 - x1) * q, y: yy - Math.sin(Math.PI * q) * hgt }); }, t0, dur, io);
}
// a horizontal arrow from x1 to x2 at y, drawn on

}
