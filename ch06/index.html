/* ---------- text helpers (as in ch01 / ch03) ---------- */

function bubble(p, str, x, y, t0, { w = 420, color = SAFF, size = 30, font = UI, fill = '#fff', tc = COL.chalk } = {}) {

// pill banner centred on (x,y)
function dwBanner(p, str, x, y, t0, { w = 760, color = CORAL, size = 40, fill = '#fff', sub } = {}) {
  const g = G(p, { x, y, o: 0, s: .8 });

// word chip (rounded box) centred on (x,y)

// a vertical meter: frame + fill from the bottom; g._fill scales with s (use tw(g._fill, {s: q}))
function kmBar(p, x, y, h, color, cap) {

function kmPlant(p, x, y, stage = 0, s = 1) {

      T(g, words.slice(half).join(' '), { x: 66, y: 38, size: 24, fill: COL.chalk, weight: 700 });

    });

  ['day2', 'आज आपण तीन गोष्टी पाहिल्या', (m) => {

    for (let i = 0; i < 6; i++) mk('circle', { cx: Math.cos(i) * 36, cy: Math.sin(i * 1.3) * 26, r: 4, fill: SAFF }, cell);
    tw(cell, { o: 1, s: 1 }, m('cell', .4), .6, back);

    dwBanner(p, '🔬 Tomorrow, we go inside the human body…', 500, 780, m('tomorrow'), { w: 760, size: 30, color: LIVE });

      { parts: ['“मला अजून जमत नाही.”'], ans: ['help'], why: '“अजून”— practice मुळे ability वाढू शकते.' },

      { parts: ['“माझ्यात सुधारण्याची क्षमता आहे.”'], ans: ['help'], why: 'Weakness म्हणजे शिक्कामोर्तब नाही; ती सुधारता येते.' },
